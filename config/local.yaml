MESSAGING_CONFIG:
  TELEGRAM:
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  BIRD:
    BIRD_API_URL: https://api.bird.com
    BIRD_ORGANIZATION_ID: ${BIRD_ORGANIZATION_ID}
    BIRD_WORKSPACE_ID: ${BIRD_WORKSPACE_ID}
    BIRD_API_KEY: ${BIRD_API_KEY}
    BIRD_SIGNING_KEY: ${BIRD_SIGNING_KEY}

DATABASE_CONFIG:
  SUPABASE:
    URL: ${SUPABASE_URL}
    KEY: ${SUPABASE_KEY}

BEHAVIORS_CONFIG:
  ACTION_MANAGER:
    LLM_NAME: claude-3-sonnet-20240229
  INTENT_MANAGER:
    LLM_NAME: claude-3-sonnet-20240229
  MEMORY_MANAGER:
    LLM_NAME: claude-3-sonnet-20240229
  TASK_MANAGER:
    REDIS_URL: redis://127.0.0.1
  
WEB_ACCESS_CONFIG:
  GOOGLE:
    GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    GOOGLE_AUTH_SCOPE:
      - https://www.googleapis.com/auth/calendar
      - https://www.googleapis.com/auth/drive.file
    CALENDAR:
      CALENDAR_NAME: Life Tracking
      CALENDAR_DESCRIPTION: Use this calendar to track what you do day to day.
    DRIVE:
      FOLDER_NAME: Life Tracking
      FILE_NAME_FORMAT: "%m_%d_%y %H:%M"

